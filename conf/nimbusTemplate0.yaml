#
# storm configuration file
#
storm.zookeeper.servers:
    - "montage-storm-zk31-1150684.stratus.lvs.ebay.com"

ui.port: 8090

nimbus.host: "montage-nimbus10-1150683.stratus.lvs.ebay.com"

#topology.metrics.consumer.register:
#  - class: "backtype.storm.metric.LoggingMetricsConsumer"
#    parallelism.hint: 1


# netty transport
storm.messaging.transport: "backtype.storm.messaging.netty.Context"
storm.messaging.netty.server_worker_threads: 1
storm.messaging.netty.client_worker_threads: 1
storm.messaging.netty.buffer_size: 5242880
storm.messaging.netty.max_retries: 30
storm.messaging.netty.max_wait_ms: 1000
storm.messaging.netty.min_wait_ms: 100


#java settings
#worker.childopts: "-Xmx1024m"
#worker.childopts: "-Xmx1536m"
#supervisor.childopts: "-Xmx256m"
#nimbus.childopts: "-Xmx1024m"
#ui.childopts: "-Xmx768m"
#nimbus.thrift.threads: 256

#itopology.metrics.consumer.register:
#  - class: "com.ebay.hubble.metrics.storm.HubbleMetricsConsumer"
#    parallelism.hint: 1
#    argument:
#      straas.hubble.conf.file: "/etc/storm/hubble-storm.conf"

supervisor.slots.ports:
    - 6700
    - 6701
    - 6702
    - 6703
    - 6704
    - 6705
    - 6706
    - 6707

storm.scheduler: backtype.storm.scheduler.IsolationScheduler

isolation.scheduler.machines:
      "markdown-mon-topology": 8
      "web-check-topology": 8
      "clean-up-topology": 1
      "aggregator": 16
      "dbloadsession-mon-topology": 4
      "batchload-mon-topology": 1
      "db-load-session-tracker-topology": 1
      "suppress-message-topology": 1


#isolation.scheduler.machines:
#      "markdown-mon-topology": 2
#      "web-check-topology": 8
#      "clean-up-topology": 1
#      "aggregator": 16
#      "dbloadsession-mon-topology": 4
#      "batch-load-mon": 1
#      "suppress-message-topology": 1

#how long supervisor will wait to ensure that a worker process is started
supervisor.worker.start.timeout.secs: 600

#how long between heartbeats until supervisor considers that worker dead and tries to restart it
supervisor.worker.timeout.secs: 300


nimbus.childopts: "-Dcom.sun.management.jmxremote.port=9999 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false "
#worker.childopts: "-Dcom.sun.management.jmxremote.port=1%ID% -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false "
#supervisor.childopts: "-Dcom.sun.management.jmxremote.port=9999 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false "

